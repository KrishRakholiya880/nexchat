version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: nexchat_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: nexchatdb
      MYSQL_USER: nexchatuser
      MYSQL_PASSWORD: nexchatpass
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: nexchat_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysqldata:
